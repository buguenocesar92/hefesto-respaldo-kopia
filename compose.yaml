# =============================================================================
# Hefesto Studio - kit de respaldo Kopia
# Kopia Repository Server: da acceso centralizado al repositorio para que los
# clientes NO necesiten las credenciales del almacenamiento.
#
# Orden de arranque (importante, ver docs/01-INSTALACION-DOCKER.md):
#   1. cp .env.example .env  y completar los secretos
#   2. ./scripts/crear-repositorio.sh       (crea el repo y fija la politica)
#   3. docker compose up -d
#
# El servidor NO arranca si el repositorio no existe: upstream documenta que
# hay que "create and configure a repository" antes de arrancar el servidor.
# Fuente: https://kopia.io/docs/repository-server/#starting-repository-server
# =============================================================================

services:
  kopia:
    # Version fijada por etiqueta Y por digest. Nunca :latest.
    # Ver VERSION.md para la fecha de verificacion y como resolver el digest.
    image: kopia/kopia:0.23.1@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e
    restart: unless-stopped

    # El ENTRYPOINT de la imagen oficial ES /bin/kopia
    # (tools/docker/Dockerfile), por eso el command arranca en "server".
    #
    # --address        : por defecto upstream es http://127.0.0.1:51515
    #                    (cli/command_server.go). Lo subimos a 0.0.0.0 DENTRO
    #                    del contenedor para que Traefik (Coolify) llegue al
    #                    servicio por la red interna del proyecto. NO se
    #                    publica ningun puerto al host: ver scripts/coolify-check.sh.
    # --ui             : interfaz web KopiaUI (por defecto true).
    # --control-api    : API de control (por defecto true).
    #
    # DELIBERADAMENTE NO USAMOS:
    #   --insecure                   -> flag oculto de upstream, texto oficial:
    #                                     "Allow insecure configurations
    #                                      (do not use in production)".
    #   --disable-csrf-token-checks   -> flag oculto de upstream, solo para
    #                                     desarrollo/depuracion. El compose
    #                                     oficial de Kopia lo trae, pero es un
    #                                     ejemplo de estacion de trabajo, no
    #                                     un despliegue de produccion.
    # Ver docs/02-INSTALACION-COOLIFY.md, seccion "Banderas que NO activamos".
    command:
      - server
      - start
      - --address=0.0.0.0:51515

    environment:
      # # OBLIGATORIA. Clave del repositorio. Ver .env.example.
      KOPIA_PASSWORD: ${KOPIA_PASSWORD:?falta KOPIA_PASSWORD en .env}

      # Autenticacion de la interfaz web y de la API.
      # Upstream lee KOPIA_SERVER_USERNAME / KOPIA_SERVER_PASSWORD para
      # --server-username / --server-password (cli/command_server.go).
      # El mismo par de variables lo consume `kopia server status` del lado
      # cliente (serverClientFlags), que es lo que usa el healthcheck.
      KOPIA_SERVER_USERNAME: ${KOPIA_SERVER_USERNAME:?falta KOPIA_SERVER_USERNAME en .env}
      KOPIA_SERVER_PASSWORD: ${KOPIA_SERVER_PASSWORD:?falta KOPIA_SERVER_PASSWORD en .env}

      # Cuenta de control, separada de la cuenta de la interfaz.
      KOPIA_SERVER_CONTROL_USERNAME: ${KOPIA_SERVER_CONTROL_USERNAME:-control-respaldos}
      KOPIA_SERVER_CONTROL_PASSWORD: ${KOPIA_SERVER_CONTROL_PASSWORD:?falta KOPIA_SERVER_CONTROL_PASSWORD en .env}

      TZ: ${KOPIA_TIMEZONE:-America/Santiago}

    # NO SE PUBLICA NINGUN PUERTO AL HOST. El servidor queda accesible SOLO en
    # la red interna del proyecto. El acceso desde afuera es por Traefik
    # (Coolify), que enruta el dominio a este servicio.
    #
    # ADVERTENCIA DE SEGURIDAD: el servidor expone la UI, la API de control
    # y el endpoint /metrics de Prometheus, que upstream registra SIN
    # autenticacion (cli/command_server_start.go: "init prometheus after
    # adding interceptors that require credentials, so that this handler
    # can be called without auth"). Por eso en Traefik solo se debe enrutar
    # la UI (/), NO /metrics ni la API de control.
    #
    # NO agregues 'ports:' aca: rompe el contrato del kit con Coolify
    # (ver scripts/coolify-check.sh). Si necesitas diagnosticar localmente,
    # expone el puerto con un override puntual.

    volumes:
      # Configuracion del repositorio: CONTIENE la configuracion que da acceso
      # al almacenamiento. Es lo mas critico de respaldar.
      - kopia-config:/app/config
      # Caché local. Regenerable. Borrarla solo cuesta tiempo, no datos.
      - kopia-cache:/app/cache
      # Logs.
      - kopia-logs:/app/logs

    # Sin privileged, sin SYS_ADMIN, sin /dev/fuse, sin apparmor:unconfined.
    # Esos se necesitan SOLO para `kopia mount` (FUSE). El compose por defecto
    # no monta instantaneas, asi que no los pide. Ver docs/05.

    healthcheck:
      # Healthcheck PROPIO, no copiado de upstream: la imagen oficial no
      # declara HEALTHCHECK en su Dockerfile.
      #
      # Usa `kopia server status`, que pega a la API de control
      # (GET control/sources, cli/command_server_status.go). Verifica que el
      # servidor responde Y esta autenticado de verdad, no solo que el puerto
      # esta abierto.
      #
      # Las credenciales salen de KOPIA_SERVER_USERNAME / KOPIA_SERVER_PASSWORD,
      # que ya estan en el entorno del contenedor: NO se escribe ningun
      # secreto dentro del comando, asi que `docker inspect` no lo filtra.
      test:
        - CMD
        - /bin/kopia
        - server
        - status
        - --address=http://127.0.0.1:51515
      interval: 60s
      timeout: 30s
      # Margen generoso para el primer arranque: tiene que abrir el repositorio.
      start_period: 90s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Volumenes con nombre derivado de ${VOLUME_PREFIX}.
  #
  # Por defecto Docker Compose antepone el nombre del proyecto a los volumenes
  # (`<proyecto>_kopia-config`). Fijando `name:` con un prefijo optativo
  # (variable VOLUME_PREFIX, default `hefesto`) los contenedores desechables
  # que lanzan los scripts en scripts/lib.sh se conectan a los MISMOS volumenes
  # que el servidor. Cambia VOLUME_PREFIX en Coolify si tenes mas de una
  # instancia del kit compartiendo el mismo Docker host.
  kopia-config:
    name: ${VOLUME_PREFIX:-hefesto}-kopia-config
  kopia-cache:
    name: ${VOLUME_PREFIX:-hefesto}-kopia-cache
  kopia-logs:
    name: ${VOLUME_PREFIX:-hefesto}-kopia-logs